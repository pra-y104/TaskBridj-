<!doctype html><html lang="en"><head><title>Participant · TaskBridj</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:20px;padding-bottom:60px">
<div class="grid two"><div class="card"><div style="color:var(--muted)">Available earnings</div><div class="stat" id="bal">₦0</div></div>
<div class="card"><div style="color:var(--muted)">Awaiting verification</div><div class="stat" id="wait" style="color:#fcd34d">0</div></div></div>
<div class="tabs"><button class="tab on" data-t="browse">Browse tasks</button><button class="tab" data-t="mine">My submissions</button><button class="tab" data-t="earn">Earnings history</button></div>
<div id="filter"><select id="type"><option value="">All task types</option><option>App testing</option><option>Website testing</option><option>Survey</option><option>Feedback &amp; research</option></select></div>
<div id="list" class="grid" style="margin-top:14px"></div></div>
<div id="modal" class="modal hidden"><div id="mbody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let me,tab='browse';
(async()=>{me=await guard('participant');if(!me)return;nav.innerHTML=navbar(me);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));filter.classList.toggle('hidden',tab!=='browse');load()});
type.onchange=load;load()})();
async function stats(){
 const {data:l}=await sb.from('ledger').select('amount');bal.textContent=naira((l||[]).reduce((a,b)=>a+Number(b.amount),0));
 const {count}=await sb.from('submissions').select('id',{count:'exact',head:true}).eq('status','pending');wait.textContent=count||0}
async function load(){stats();list.innerHTML='<p class="note">Loading…</p>';
 if(tab==='browse'){
  let q=sb.from('campaigns_public').select('*').order('created_at',{ascending:false});if(type.value)q=q.eq('task_type',type.value);
  const [{data},{data:mine}]=await Promise.all([q,sb.from('submissions').select('campaign_id')]);
  const done=new Set((mine||[]).map(x=>x.campaign_id));
  list.innerHTML=(data||[]).map(c=>{const open=c.slots-c.taken;return `<div class="card"><div class="row"><span class="tag">${esc(c.task_type)}</span><b style="color:var(--green)">${naira(c.reward_naira)}</b></div>
  <h3 style="font-size:19px">${esc(c.title)}</h3><p style="margin-bottom:12px">${esc(c.instructions).slice(0,160)}</p>
  <div class="row"><span style="color:var(--muted);font-size:14px">${Math.max(open,0)} of ${c.slots} slots open</span>
  ${done.has(c.id)?'<span class="tag wait">Already submitted</span>':open>0?`<button class="btn btn-blue btn-sm" onclick="start('${c.id}')">Start Task</button>`:'<span class="tag">Full</span>'}</div></div>`}).join('')||'<p class="note">No tasks available right now. Check back soon.</p>';
 }else if(tab==='mine'){
  const {data}=await sb.from('submissions').select('*,campaigns_public(title,reward_naira)').order('created_at',{ascending:false});
  list.innerHTML=(data||[]).map(s=>`<div class="card"><div class="row"><b>${esc(s.campaigns_public?.title)}</b><span class="tag ${s.status==='approved'?'ok':s.status==='rejected'?'bad':'wait'}">${s.status}</span></div>
  <p style="margin:10px 0 0">Reward: ${naira(s.campaigns_public?.reward_naira)}${s.reject_reason?' · Reason: '+esc(s.reject_reason):''}</p></div>`).join('')||'<p class="note">You have not submitted any task yet.</p>';
 }else{
  const {data}=await sb.from('ledger').select('*').order('created_at',{ascending:false});
  list.innerHTML=(data||[]).map(e=>`<div class="card row"><span>Approved submission · ${new Date(e.created_at).toLocaleDateString('en-NG')}</span><b style="color:var(--green)">+${naira(e.amount)}</b></div>`).join('')||'<p class="note">Earnings appear here after a submission is approved.</p>';
 }}
async function start(id){
 const {data:c}=await sb.from('campaigns_public').select('*').eq('id',id).single();
 const qs=c.questions||[];
 mbody.innerHTML=`<div class="row"><h3 style="margin:0">${esc(c.title)}</h3><button class="btn btn-out btn-sm" onclick="modal.classList.add('hidden')">Close</button></div>
 <p style="color:var(--muted)">${esc(c.instructions)}</p><p><b>Requirements:</b> ${esc(c.requirements||'None')}</p>
 ${qs.map((q,i)=>`<label>${esc(q)}<textarea rows="2" class="ans"></textarea></label>`).join('')}
 <label>Evidence: ${esc(c.evidence_required||'Upload a screenshot')}<input type="file" id="file" accept="image/*,video/*,.pdf"></label>
 <button id="send" class="btn btn-blue block" style="margin-top:20px">Submit task</button>`;
 modal.classList.remove('hidden');
 send.onclick=async()=>{
  const f=file.files[0];if(!f)return toast('Upload your evidence first');
  if(f.size>20*1024*1024)return toast('File must be under 20 MB');
  const answers=[...document.querySelectorAll('.ans')].map(a=>a.value.trim());
  if(answers.some(a=>!a))return toast('Answer every question');
  send.disabled=true;
  const path=me.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^\w.\-]/g,'_');
  const up=await sb.storage.from('evidence').upload(path,f);
  if(up.error){send.disabled=false;return toast(up.error.message)}
  const {error}=await sb.from('submissions').insert({campaign_id:id,participant_id:me.id,answers,evidence_path:path});
  if(error){send.disabled=false;return toast(error.message.includes('duplicate')?'You already submitted this task':error.message)}
  modal.classList.add('hidden');toast('Submitted. Awaiting review.');load()}}
</script></body></html>
