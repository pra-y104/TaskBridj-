<!doctype html><html lang="en"><head><title>Admin · TaskBridj</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:20px;padding-bottom:60px">
<div class="grid three" id="stats"></div>
<div class="tabs"><button class="tab" data-t="overview">Overview</button><button class="tab on" data-t="pending">Campaigns to review</button><button class="tab" data-t="wd">Withdrawals</button><button class="tab" data-t="price">Pricing</button><button class="tab" data-t="types">Task types</button><button class="tab" data-t="appeals">Appeals</button><button class="tab" data-t="refunds">Refunds</button><button class="tab" data-t="audit">Audit log</button><button class="tab" data-t="support">Support</button><button class="tab" data-t="users">Users</button><button class="tab" data-t="all">All campaigns</button></div>
<div id="view" class="grid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let me,tab='pending';
(async()=>{me=await guard('admin');if(!me)return;nav.innerHTML=navbar(me);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));load()});load()})();
async function load(){
 const [u,c,s]=await Promise.all([sb.from('profiles').select('id',{count:'exact',head:true}),sb.from('campaigns').select('id',{count:'exact',head:true}),sb.from('submissions').select('id',{count:'exact',head:true})]);
 stats.innerHTML=[['Users',u.count],['Campaigns',c.count],['Submissions',s.count]].map(([a,b])=>`<div class="card"><div style="color:var(--muted)">${a}</div><div class="stat">${b||0}</div></div>`).join('');

 if(tab==='overview'){const {data:o,error}=await sb.rpc('admin_overview');if(error||!o){view.innerHTML='<p class="note">'+esc(error?error.message:'No data')+'</p>';return}
  const card=(x,y)=>`<div class="card" style="padding:16px"><div style="color:var(--muted);font-size:13px">${x}</div><div class="stat" style="color:#fff;font-size:22px;margin-top:4px">${y}</div></div>`;const m=z=>naira(Math.round(+z));
  view.innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr">${card('Participants',o.participants)}${card('Businesses',o.businesses)}${card('Live projects',o.projects_live)}${card('Projects waiting',o.projects_waiting)}${card('Submissions to review',o.submissions_pending)}${card('Open tickets',o.tickets_open)}${card('Appeals pending',o.appeals_pending)}${card('Suspended accounts',o.suspended)}${card('Funded by businesses',m(o.funded_total))}${card('Rewards credited',m(o.rewards_total))}${card('Referral bonuses',m(o.referral_total))}${card('Withdrawals paid',m(o.withdrawn_paid))}${card('Withdrawals pending',m(o.withdrawals_pending))}${card('Refunds pending',m(o.refunds_pending))}</div>
  <div class="card" style="margin-top:12px"><div style="color:var(--muted);font-size:13px">Estimated margin so far</div><div class="stat" style="font-size:26px">${m(o.funded_total-o.rewards_total-o.referral_total-o.refunds_pending)}</div><p style="margin:6px 0 0;font-size:13px;color:var(--muted)">Funded money minus rewards, referral bonuses and pending refunds. It is before payment fees and does not include unused funds that may still be refunded.</p></div>`;return}
 if(tab==='types'){const {data:R}=await sb.from('rates').select('*').order('sort').order('task_type');TR=R||[];let last='';
  view.innerHTML=`<div class="card"><h3 style="margin-top:0">Add task type</h3><label>Name<input id="nt2"></label><label>Group<input id="ng2" placeholder="e.g. Research & Feedback"></label><label>Price per participant (₦)<input id="np2" type="number"></label><label>Default minutes<input id="nm2" type="number" value="10"></label><button class="btn btn-blue btn-sm" style="margin-top:12px" onclick="newType()">Add</button></div>`+
  TR.map((r,i)=>{const head=r.grp!==last?(last=r.grp,`<h3 style="margin:22px 0 6px">${esc(r.grp)}</h3>`):'';
   return head+`<details class="card" style="padding:14px;margin-top:8px"><summary style="cursor:pointer;list-style:none"><div class="row"><b>${esc(r.task_type)}</b><span class="tag ${r.active?(r.quote_only?'wait':'ok'):'bad'}">${r.active?(r.quote_only?'custom quote':naira(r.price)):'disabled'}</span></div></summary>
   <label>Price per participant (₦)<input type="number" id="tp${i}" value="${r.price}"></label><label>Default minutes<input type="number" id="tm${i}" value="${r.default_minutes||''}"></label>
   <label>Description<textarea id="td${i}" rows="3">${esc(r.description||'')}</textarea></label><label>Evidence hint<input id="te${i}" value="${esc(r.evidence_hint||'')}"></label><label>Group<input id="tg${i}" value="${esc(r.grp)}"></label>
   <label class="chk"><input type="checkbox" id="tq${i}" ${r.quote_only?'checked':''}><span>Custom quote only</span></label>
   <div style="margin-top:14px"><button class="btn btn-blue btn-sm" onclick="saveType(${i})">Save</button> <button class="btn btn-out btn-sm" onclick="moveType(${i},-1)">Up</button> <button class="btn btn-out btn-sm" onclick="moveType(${i},1)">Down</button> <button class="btn ${r.active?'btn-red':'btn-green'} btn-sm" onclick="toggleType(${i})">${r.active?'Disable':'Enable'}</button></div></details>`}).join('');return}
 if(tab==='support'){const [{data:T},{data:M},{data:pp}]=await Promise.all([sb.from('tickets').select('*').order('updated_at',{ascending:false}).limit(50),sb.from('ticket_messages').select('*').order('created_at'),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));
  view.innerHTML=(T||[]).map(t=>`<div class="card"><div class="row"><b>${esc(t.ref)} · ${esc(t.subject)}</b><span class="tag ${t.status==='closed'?'':t.status==='answered'?'ok':'wait'}">${t.status}</span></div><p style="margin:6px 0;font-size:13px;color:var(--muted)">${esc(N[t.user_id])} · ${esc(t.category)}</p>${(M||[]).filter(m=>m.ticket_id===t.id).map(m=>`<p style="margin:6px 0;font-size:14px"><b>${m.is_staff?'TaskBridj':'User'}:</b> ${esc(m.body)}</p>`).join('')}${t.status!=='closed'?`<textarea id="r-${t.id}" rows="2"></textarea><button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="replyT('${t.id}')">Reply</button> <button class="btn btn-out btn-sm" style="margin-top:8px" onclick="closeT('${t.id}')">Close</button>`:''}</div>`).join('')||'<p class="note">No tickets.</p>';return}
 if(tab==='audit'){const [{data:L},{data:pp}]=await Promise.all([sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(100),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));
  const diff=x=>{const o=x.detail?.old||{},n=x.detail?.new||{};const ks=Object.keys({...o,...n}).filter(k=>k!=='created_at'&&JSON.stringify(o[k])!==JSON.stringify(n[k]));return ks.slice(0,4).map(k=>k+': '+(x.action==='INSERT'?'':String(o[k]??'')+' → ')+String(n[k]??'')).join(' · ')};
  view.innerHTML=(L||[]).map(x=>`<div class="card" style="padding:16px"><div class="row"><b>${esc(x.table_name)} · ${x.action}</b><span style="color:var(--muted);font-size:13px">${new Date(x.created_at).toLocaleString('en-NG')}</span></div><p style="margin:6px 0 0;font-size:14px">By ${esc(N[x.actor]||'system')}${x.row_id?' · '+esc(String(x.row_id).slice(0,8)):''}</p><p style="margin:4px 0 0;font-size:13px;color:var(--muted);word-break:break-word">${esc(diff(x))}</p></div>`).join('')||'<p class="note">No records yet.</p>';return}
 if(tab==='appeals'){const [{data:A},{data:pp}]=await Promise.all([sb.from('appeals').select('*,submissions(evidence_path,answers,reject_reason)').order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));let h='';
  for(const x of (A||[])){let l='';const ev=x.submissions?.evidence_path;if(ev){const {data:u}=await sb.storage.from('evidence').createSignedUrl(ev,600);if(u)l=`<a href="${u.signedUrl}" target="_blank" rel="noopener" style="color:#60a5fa">View evidence</a>`}
   h+=`<div class="card"><div class="row"><b>${esc(N[x.participant_id])}</b><span class="tag ${x.status==='upheld'?'ok':x.status==='denied'?'bad':'wait'}">${x.status}</span></div><p style="margin:8px 0">Rejected because: ${esc(x.submissions?.reject_reason||'')}</p><p style="margin:8px 0">Appeal: ${esc(x.message)}</p>${l}${x.status==='pending'?`<div style="margin-top:10px"><button class="btn btn-green btn-sm" onclick="appealSet('${x.id}',true)">Uphold (pay)</button> <button class="btn btn-red btn-sm" onclick="appealSet('${x.id}',false)">Deny</button></div>`:''}</div>`}
  view.innerHTML=h||'<p class="note">No appeals.</p>';return}
 if(tab==='refunds'){const [{data:R2},{data:pp}]=await Promise.all([sb.from('refund_requests').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));
  view.innerHTML=(R2||[]).map(r=>`<div class="card"><div class="row"><b>${naira(r.net)}</b><span class="tag ${r.status==='refunded'?'ok':r.status==='rejected'?'bad':'wait'}">${r.status}</span></div><p style="margin:8px 0">${esc(N[r.business_id])} · unused ${naira(r.gross)} − fee ${naira(r.fee)}</p>${r.status==='pending'?`<button class="btn btn-green btn-sm" onclick="refundSet('${r.id}','refunded')">Mark refunded</button> <button class="btn btn-red btn-sm" onclick="refundSet('${r.id}','rejected')">Reject</button>`:''}</div>`).join('')||'<p class="note">No refund requests.</p>';return}
 if(tab==='price'){const [{data:R},{data:T}]=await Promise.all([sb.from('rates').select('*').order('task_type'),sb.from('settings').select('*').order('key')]);
  const L={tester_share:'Tester share (0.60 = 60%)',recording_extra:'Screen recording extra per participant (₦)',min_withdrawal:'Minimum withdrawal (₦)',max_tasks_per_person:'Max tasks per person per project',min_budget:'Minimum project budget (₦)'};
  const {data:Q}=await sb.from('quote_requests').select('*').order('created_at',{ascending:false}).limit(20);const {data:BP}=await sb.from('profiles').select('id,full_name,contact_email');const BN=Object.fromEntries((BP||[]).map(p=>[p.id,(p.full_name||'')+(p.contact_email?' · '+p.contact_email:'')]));
  view.innerHTML='<div class="card"><h3 style="margin-top:0">Price per participant (what businesses pay)</h3>'+(R||[]).map(r=>`<label>${esc(r.task_type)}<div class="row" style="flex-wrap:nowrap"><input type="number" id="r-${esc(r.task_type)}" value="${r.price}"><button class="btn btn-blue btn-sm" onclick="saveRate('${esc(r.task_type)}')">Save</button></div></label>`).join('')+'</div><div class="card"><h3 style="margin-top:0">Platform settings</h3>'+(T||[]).map(s=>`<label>${esc(L[s.key]||s.key)}<div class="row" style="flex-wrap:nowrap"><input type="number" step="any" id="s-${esc(s.key)}" value="${s.value}"><button class="btn btn-blue btn-sm" onclick="saveSet('${esc(s.key)}')">Save</button></div></label>`).join('')+'<p class="note" style="text-align:left">Changes apply to new projects only.</p></div><div class="card"><h3 style="margin-top:0">Add task type</h3><label>Name<input id="nt"></label><label>Price per participant (₦)<input id="np" type="number"></label><button class="btn btn-blue btn-sm" style="margin-top:12px" onclick="addType()">Add</button></div><div class="card"><h3 style="margin-top:0">Custom quote requests</h3>'+((Q||[]).map(q=>`<p style="margin:8px 0">${esc(BN[q.business_id]||'')} · ${esc(q.task_type)} · ${q.participants} participants · ${esc(q.note||'')}</p>`).join('')||'<p class="note" style="text-align:left">None yet.</p>')+'</div>';return}
 if(tab==='wd'){const [{data},{data:pp}]=await Promise.all([sb.from('withdrawals').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));
  view.innerHTML=(data||[]).map(w=>`<div class="card"><div class="row"><b>${naira(w.amount)}</b><span class="tag ${w.status==='paid'?'ok':w.status==='rejected'?'bad':'wait'}">${w.status}</span></div><p style="margin:8px 0">${esc(N[w.participant_id])} · ${esc(w.bank_name)} · ${esc(w.account_name)} · ${esc(w.account_number)}</p>${w.status==='pending'?`<button class="btn btn-green btn-sm" onclick="wdSet('${w.id}','paid')">Mark paid</button> <button class="btn btn-red btn-sm" onclick="wdSet('${w.id}','rejected')">Reject</button>`:''}</div>`).join('')||'<p class="note">No withdrawals.</p>';return}
 if(tab==='users'){const {data}=await sb.from('profiles').select('id,full_name,role,suspended,suspended_reason,created_at').order('created_at',{ascending:false}).limit(300);window.UL=data||[];
  const draw=f=>{const q=(f||'').toLowerCase();document.getElementById('ulist').innerHTML=window.UL.filter(p=>!q||(p.full_name||'').toLowerCase().includes(q)||p.role.includes(q)).map(p=>`<div class="card row" style="padding:14px"><span>${esc(p.full_name)||'(no name)'}<br><small style="color:var(--muted)">${p.role}${p.suspended?' · suspended':''}</small></span>${p.role==='admin'?'<span class="tag">admin</span>':`<button class="btn ${p.suspended?'btn-green':'btn-red'} btn-sm" onclick="suspendU('${p.id}',${!p.suspended})">${p.suspended?'Restore':'Suspend'}</button>`}</div>`).join('')||'<p class="note">No users found.</p>'};
  view.innerHTML='<input id="usearch" placeholder="Search name or role" style="margin-bottom:12px"><div id="ulist" class="grid"></div>';usearch.oninput=()=>draw(usearch.value);draw('');return}
 let q=sb.from('campaigns').select('*').order('created_at',{ascending:false});if(tab==='pending')q=q.eq('status','pending_review');
 const {data}=await q;
 view.innerHTML=(data||[]).map(c=>`<div class="card"><div class="row"><span class="tag">${esc(c.task_type)}</span><span class="tag ${c.status==='active'?'ok':c.status==='rejected'?'bad':'wait'}">${c.status.replace('_',' ')}</span></div>
 <h3 style="font-size:19px">${esc(c.title)}</h3><p style="margin-bottom:8px">${esc(c.instructions)}</p><p style="margin-bottom:12px;font-size:14px">Evidence: ${esc(c.evidence_required)} · ${c.slots} slots · ${naira(c.reward_naira)}</p>
 ${c.status==='pending_review'?`<button class="btn btn-green btn-sm" onclick="decide('${c.id}',true)">Approve</button> ${c.funded?'':`<button class="btn btn-out btn-sm" onclick="fund('${c.id}')">Mark funded</button>`} <button class="btn btn-red btn-sm" onclick="decide('${c.id}',false)">Reject</button>`:''}</div>`).join('')||'<p class="note">Nothing here.</p>'}
let TR=[];
async function saveType(i){const r=TR[i],g=k=>document.getElementById(k+i);const patch={price:+g('tp').value,default_minutes:+g('tm').value||null,description:g('td').value.trim(),evidence_hint:g('te').value.trim(),grp:g('tg').value.trim()||'Other',quote_only:g('tq').checked};
 if(!(patch.price>0))return toast('Enter a valid price');const {error}=await sb.from('rates').update(patch).eq('task_type',r.task_type);toast(error?error.message:'Saved');if(!error)load()}
async function toggleType(i){const r=TR[i];const {error}=await sb.from('rates').update({active:!r.active}).eq('task_type',r.task_type);toast(error?error.message:(r.active?'Disabled':'Enabled'));load()}
async function moveType(i,d){const a=TR[i],b=TR[i+d];if(!b||b.grp!==a.grp)return toast('Already at the edge of this group');let s1=b.sort,s2=a.sort;if(s1===s2)s1=a.sort+d*5;
 await Promise.all([sb.from('rates').update({sort:s1}).eq('task_type',a.task_type),sb.from('rates').update({sort:s2}).eq('task_type',b.task_type)]);load()}
async function newType(){const t=nt2.value.trim(),p=+np2.value;if(!t||!(p>0))return toast('Enter a name and a price');
 const {error}=await sb.from('rates').insert({task_type:t,price:p,grp:ng2.value.trim()||'Other',sort:Math.max(0,...TR.map(r=>r.sort))+10,default_minutes:+nm2.value||10});toast(error?error.message:'Added');load()}
async function appealSet(id,up){const n=prompt('Note for the record (optional):')??'';if(!confirm(up?'Uphold this appeal and pay the participant?':'Deny this appeal?'))return;const {error}=await sb.rpc('resolve_appeal',{p_id:id,p_uphold:up,p_note:n});toast(error?error.message:'Done');load()}
async function refundSet(id,st){if(!confirm('Set this refund to '+st+'?'))return;const {error}=await sb.from('refund_requests').update({status:st}).eq('id',id);toast(error?error.message:'Done');load()}
async function replyT(id){const b=document.getElementById('r-'+id).value.trim();if(b.length<2)return toast('Write a reply');const {error}=await sb.rpc('reply_ticket',{p_tid:id,p_body:b});toast(error?error.message:'Reply sent');load()}
async function closeT(id){const {error}=await sb.rpc('close_ticket',{p_tid:id});toast(error?error.message:'Closed');load()}
async function suspendU(id,on){let r='';if(on){r=prompt('Reason for suspending this account (the user is not shown this reason):');if(r===null)return}else if(!confirm('Restore this account?'))return;
 const {error}=await sb.rpc('set_suspended',{p_uid:id,p_on:on,p_reason:r});toast(error?error.message:(on?'Account suspended':'Account restored'));load()}
async function addType(){const t=nt.value.trim(),v=+np.value;if(!t||!(v>0))return toast('Enter a name and a price');const {error}=await sb.from('rates').insert({task_type:t,price:v});toast(error?error.message:'Added');load()}
async function saveRate(t){const v=+document.getElementById('r-'+t).value;if(!(v>0))return toast('Enter a valid price');const {error}=await sb.from('rates').update({price:v}).eq('task_type',t);toast(error?error.message:'Saved')}
async function saveSet(k){const v=+document.getElementById('s-'+k).value;if(!(v>=0))return toast('Enter a valid number');if(k==='tester_share'&&(v<0.3||v>0.9))return toast('Tester share must be between 0.30 and 0.90');const {error}=await sb.from('settings').update({value:v}).eq('key',k);toast(error?error.message:'Saved')}
async function fund(id){const {error}=await sb.from('campaigns').update({funded:true}).eq('id',id);if(error)return toast(error.message);toast('Marked as funded');load()}
async function wdSet(id,st){if(!confirm('Set this withdrawal to '+st+'?'))return;const {error}=await sb.from('withdrawals').update({status:st}).eq('id',id);if(error)return toast(error.message);load()}
async function decide(id,ok){
 let patch={status:'active',reject_reason:null};
 if(!ok){const r=prompt('Reason for rejecting:');if(!r||!r.trim())return toast('A reason is required');patch={status:'rejected',reject_reason:r}}
 const {error}=await sb.from('campaigns').update(patch).eq('id',id);
 if(error)return toast(error.message);toast(ok?'Campaign approved':'Campaign rejected');load()}
</script></body></html>
