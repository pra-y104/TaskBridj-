<!doctype html><html lang="en"><head><title>Admin · TaskBridj</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:20px;padding-bottom:60px">
<div class="grid three" id="stats"></div>
<div class="tabs"><button class="tab on" data-t="pending">Campaigns to review</button><button class="tab" data-t="wd">Withdrawals</button><button class="tab" data-t="price">Pricing</button><button class="tab" data-t="users">Users</button><button class="tab" data-t="all">All campaigns</button></div>
<div id="view" class="grid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let me,tab='pending';
(async()=>{me=await guard('admin');if(!me)return;nav.innerHTML=navbar(me);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));load()});load()})();
async function load(){
 const [u,c,s]=await Promise.all([sb.from('profiles').select('id',{count:'exact',head:true}),sb.from('campaigns').select('id',{count:'exact',head:true}),sb.from('submissions').select('id',{count:'exact',head:true})]);
 stats.innerHTML=[['Users',u.count],['Campaigns',c.count],['Submissions',s.count]].map(([a,b])=>`<div class="card"><div style="color:var(--muted)">${a}</div><div class="stat">${b||0}</div></div>`).join('');

 if(tab==='price'){const [{data:R},{data:T}]=await Promise.all([sb.from('rates').select('*').order('task_type'),sb.from('settings').select('*').order('key')]);
  const L={tester_share:'Tester share (0.60 = 60%)',recording_extra:'Screen recording extra per participant (₦)',min_withdrawal:'Minimum withdrawal (₦)',max_tasks_per_person:'Max tasks per person per project',min_budget:'Minimum project budget (₦)'};
  const {data:Q}=await sb.from('quote_requests').select('*').order('created_at',{ascending:false}).limit(20);
  view.innerHTML='<div class="card"><h3 style="margin-top:0">Price per participant (what businesses pay)</h3>'+(R||[]).map(r=>`<label>${esc(r.task_type)}<div class="row" style="flex-wrap:nowrap"><input type="number" id="r-${esc(r.task_type)}" value="${r.price}"><button class="btn btn-blue btn-sm" onclick="saveRate('${esc(r.task_type)}')">Save</button></div></label>`).join('')+'</div><div class="card"><h3 style="margin-top:0">Platform settings</h3>'+(T||[]).map(s=>`<label>${esc(L[s.key]||s.key)}<div class="row" style="flex-wrap:nowrap"><input type="number" step="any" id="s-${esc(s.key)}" value="${s.value}"><button class="btn btn-blue btn-sm" onclick="saveSet('${esc(s.key)}')">Save</button></div></label>`).join('')+'<p class="note" style="text-align:left">Changes apply to new projects only.</p></div><div class="card"><h3 style="margin-top:0">Add task type</h3><label>Name<input id="nt"></label><label>Price per participant (₦)<input id="np" type="number"></label><button class="btn btn-blue btn-sm" style="margin-top:12px" onclick="addType()">Add</button></div><div class="card"><h3 style="margin-top:0">Custom quote requests</h3>'+((Q||[]).map(q=>`<p style="margin:8px 0">${esc(q.task_type)} · ${q.participants} participants · ${esc(q.note||'')}</p>`).join('')||'<p class="note" style="text-align:left">None yet.</p>')+'</div>';return}
 if(tab==='wd'){const [{data},{data:pp}]=await Promise.all([sb.from('withdrawals').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name')]);const N=Object.fromEntries((pp||[]).map(p=>[p.id,p.full_name]));
  view.innerHTML=(data||[]).map(w=>`<div class="card"><div class="row"><b>${naira(w.amount)}</b><span class="tag ${w.status==='paid'?'ok':w.status==='rejected'?'bad':'wait'}">${w.status}</span></div><p style="margin:8px 0">${esc(N[w.participant_id])} · ${esc(w.bank_name)} · ${esc(w.account_name)} · ${esc(w.account_number)}</p>${w.status==='pending'?`<button class="btn btn-green btn-sm" onclick="wdSet('${w.id}','paid')">Mark paid</button> <button class="btn btn-red btn-sm" onclick="wdSet('${w.id}','rejected')">Reject</button>`:''}</div>`).join('')||'<p class="note">No withdrawals.</p>';return}
 if(tab==='users'){const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
  view.innerHTML=(data||[]).map(p=>`<div class="card row"><span>${esc(p.full_name)||'(no name)'}</span><span class="tag">${p.role}</span></div>`).join('');return}
 let q=sb.from('campaigns').select('*').order('created_at',{ascending:false});if(tab==='pending')q=q.eq('status','pending_review');
 const {data}=await q;
 view.innerHTML=(data||[]).map(c=>`<div class="card"><div class="row"><span class="tag">${esc(c.task_type)}</span><span class="tag ${c.status==='active'?'ok':c.status==='rejected'?'bad':'wait'}">${c.status.replace('_',' ')}</span></div>
 <h3 style="font-size:19px">${esc(c.title)}</h3><p style="margin-bottom:8px">${esc(c.instructions)}</p><p style="margin-bottom:12px;font-size:14px">Evidence: ${esc(c.evidence_required)} · ${c.slots} slots · ${naira(c.reward_naira)}</p>
 ${c.status==='pending_review'?`<button class="btn btn-green btn-sm" onclick="decide('${c.id}',true)">Approve</button> ${c.funded?'':`<button class="btn btn-out btn-sm" onclick="fund('${c.id}')">Mark funded</button>`} <button class="btn btn-red btn-sm" onclick="decide('${c.id}',false)">Reject</button>`:''}</div>`).join('')||'<p class="note">Nothing here.</p>'}
async function addType(){const t=nt.value.trim(),v=+np.value;if(!t||!(v>0))return toast('Enter a name and a price');const {error}=await sb.from('rates').insert({task_type:t,price:v});toast(error?error.message:'Added');load()}
async function saveRate(t){const v=+document.getElementById('r-'+t).value;if(!(v>0))return toast('Enter a valid price');const {error}=await sb.from('rates').update({price:v}).eq('task_type',t);toast(error?error.message:'Saved')}
async function saveSet(k){const v=+document.getElementById('s-'+k).value;if(!(v>=0))return toast('Enter a valid number');if(k==='tester_share'&&(v<0.3||v>0.9))return toast('Tester share must be between 0.30 and 0.90');const {error}=await sb.from('settings').update({value:v}).eq('key',k);toast(error?error.message:'Saved')}
async function fund(id){const {error}=await sb.from('campaigns').update({funded:true}).eq('id',id);if(error)return toast(error.message);toast('Marked as funded');load()}
async function wdSet(id,st){if(!confirm('Set this withdrawal to '+st+'?'))return;const {error}=await sb.from('withdrawals').update({status:st}).eq('id',id);if(error)return toast(error.message);load()}
async function decide(id,ok){
 let patch={status:'active',reject_reason:null};
 if(!ok){const r=prompt('Reason for rejecting:');if(!r||!r.trim())return toast('A reason is required');patch={status:'rejected',reject_reason:r}}
 const {error}=await sb.from('campaigns').update(patch).eq('id',id);
 if(error)return toast(error.message);toast(ok?'Campaign approved':'Campaign rejected');load()}
</script></body></html>
