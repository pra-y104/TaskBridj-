<!doctype html><html lang="en"><head><title>Business · TaskBridj</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:20px;padding-bottom:60px">
<div class="tabs"><button class="tab on" data-t="camps">My projects</button><button class="tab" data-t="new">Create project</button></div>
<div id="view"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let me;
(async()=>{me=await guard('business');if(!me)return;nav.innerHTML=navbar(me);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));t.dataset.t==='new'?form():camps()});camps()})();
const stTag=s=>s==='active'?'ok':s==='rejected'?'bad':'wait';
async function camps(){
 view.innerHTML='<p class="note">Loading…</p>';
 const [{data},{data:pr}]=await Promise.all([sb.from('campaigns').select('*').order('created_at',{ascending:false}),sb.rpc('my_campaign_progress')]);
 const P=Object.fromEntries((pr||[]).map(p=>[p.campaign_id,p]));
 view.innerHTML='<div class="grid">'+((data||[]).map(c=>{const p=P[c.id]||{total:0,claimed:0,approved:0};const pc=p.total?Math.round(p.claimed/p.total*100):0;
 return `<div class="card"><div class="row"><span class="tag">${esc(c.task_type)}</span><span class="tag ${stTag(c.status)}">${c.status.replace('_',' ')}</span></div>
 <h3 style="font-size:19px">${esc(c.title)}</h3><p style="margin-bottom:10px">Budget ${naira(c.budget)} · ${c.funded?'funded':'awaiting funding confirmation'}${c.reject_reason?'<br>Reason: '+esc(c.reject_reason):''}</p>
 <div style="background:#0B1020;border-radius:99px;height:8px;overflow:hidden"><div style="width:${pc}%;height:8px;background:var(--blue)"></div></div>
 <p style="margin:8px 0 14px;font-size:14px">${p.claimed} of ${p.total} tests taken · ${p.approved} approved</p>
 <button class="btn btn-out btn-sm" onclick="subs('${c.id}')">Review submissions</button><div id="s-${c.id}" style="margin-top:12px"></div></div>`}).join('')||'<p class="note">No projects yet. Create your first project.</p>')+'</div>'}
async function subs(id){
 const box=document.getElementById('s-'+id);box.innerHTML='Loading…';
 const {data}=await sb.from('submissions').select('*').eq('campaign_id',id).order('created_at');
 if(!data?.length){box.innerHTML='<p style="color:var(--muted)">No submissions yet.</p>';return}
 let h='';for(const s of data){
  let link='';const {data:u}=await sb.storage.from('evidence').createSignedUrl(s.evidence_path,600);if(u)link=`<a href="${u.signedUrl}" target="_blank" rel="noopener" style="color:#60a5fa">View evidence</a>`;
  h+=`<div style="border-top:1px solid var(--line);padding:12px 0"><div class="row"><span class="tag ${s.status==='approved'?'ok':s.status==='rejected'?'bad':'wait'}">${s.status}</span>${link}</div>
  <div style="margin:8px 0;color:#c8cfdb;font-size:14px">${(s.answers||[]).map(a=>'• '+esc(a)).join('<br>')}</div>
  ${s.status==='pending'?`<button class="btn btn-green btn-sm" onclick="review('${s.id}',true,'${id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="review('${s.id}',false,'${id}')">Reject</button>`:s.reject_reason?'Reason: '+esc(s.reject_reason):''}</div>`}
 box.innerHTML=h}
async function review(sid,ok,cid){
 let reason=null;if(!ok){reason=prompt('Reason for rejecting (the participant will see this):');if(!reason||!reason.trim())return toast('A reason is required')}
 const {error}=await sb.rpc('review_submission',{p_id:sid,p_approve:ok,p_reason:reason});
 if(error)return toast(error.message);toast(ok?'Approved':'Rejected');subs(cid)}
function form(){
 view.innerHTML=`<div class="card" style="max-width:640px"><h3 style="margin-top:0">Create project</h3>
 <label>Project title<input id="ptitle"></label>
 <label>Task type<select id="ptype"><option>App testing</option><option>Website testing</option><option>Usability test</option><option>Bug report</option><option>Survey</option><option>Market research</option></select></label>
 <label>What should testers do?<textarea id="ins" rows="4"></textarea></label>
 <label>Who can take part? (optional)<textarea id="preq" rows="2"></textarea></label>
 <label>Questions (one per line)<textarea id="qs" rows="3"></textarea></label>
 <label>Evidence required<input id="pev" placeholder="e.g. Screenshot of the confirmation page"></label>
 <label>Your budget (₦)<input id="budget" type="number" min="1000" value="10000"></label>
 <p class="note" style="text-align:left;margin:8px 0">TaskBridj splits your budget into many small tests so more real people take part. You see the progress of every test.</p>
 <div id="err" class="err" role="alert" hidden></div>
 <button id="save" class="btn btn-blue block" style="margin-top:16px">Submit for review</button></div>`;
 save.onclick=async()=>{showErr(err,'');
  const questions=qs.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!ptitle.value.trim()||!ins.value.trim()||!questions.length||!pev.value.trim())return showErr(err,'Fill in the title, instructions, questions and evidence.');
  if(+budget.value<1000)return showErr(err,'The minimum budget is ₦1,000.');
  save.disabled=true;
  const {error}=await sb.rpc('create_campaign',{p_title:ptitle.value.trim(),p_type:ptype.value,p_ins:ins.value.trim(),p_req:preq.value.trim(),p_q:questions,p_ev:pev.value.trim(),p_budget:+budget.value});
  save.disabled=false;if(error)return showErr(err,error.message);
  toast('Submitted. Your project goes live after funding is confirmed and it is reviewed.');document.querySelector('[data-t=camps]').click()}}
</script></body></html>
