<!doctype html><html lang="en"><head><title>Business · TaskBridj</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css">
<style>body{padding-bottom:84px}.bar{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bar button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px;font-family:inherit;font-size:13px;cursor:pointer}.bar button i{display:block;font-size:19px;margin-bottom:4px}.bar button.on{color:#60a5fa}
.sec{font-size:26px;font-weight:700;margin:6px 0}.box{background:#0B1020;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}.box small{color:var(--muted);display:block}.bar2{background:#0B1020;border-radius:99px;height:8px;overflow:hidden}.bar2 div{height:8px;background:var(--blue)}#mp{display:grid;gap:8px;padding:12px 20px;border-radius:0;border-width:0 0 1px}#mp.hidden{display:none}</style></head><body>
<div class="nav"><div class="nav-in"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="">TaskBridj</a><button class="btn btn-out btn-sm" id="menu">☰ Menu</button></div></div>
<div id="mp" class="card hidden"><button class="btn btn-out btn-sm" data-v="home">Home</button><button class="btn btn-out btn-sm" data-v="projects">Projects</button><button class="btn btn-out btn-sm" data-v="create">Create project</button><button class="btn btn-out btn-sm" data-v="billing">Billing</button><button class="btn btn-out btn-sm" data-v="profile">Profile</button><button class="btn btn-blue btn-sm" onclick="logout()">Log out</button></div>
<div class="wrap" style="padding-top:18px"><div id="v"></div></div>
<div class="bar" role="navigation"><button data-v="home" class="on"><i class="fa-solid fa-house"></i>Home</button><button data-v="projects"><i class="fa-solid fa-folder-open"></i>Projects</button><button data-v="create"><i class="fa-solid fa-circle-plus"></i>Create</button><button data-v="billing"><i class="fa-solid fa-receipt"></i>Billing</button><button data-v="profile"><i class="fa-solid fa-user"></i>Profile</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let me,C=[],P={},PEND=[],PN=0;
(async()=>{me=await guard('business');if(!me)return;
 menu.onclick=e=>{e.stopPropagation();mp.classList.toggle('hidden')};
 document.addEventListener('click',e=>{if(!mp.contains(e.target))mp.classList.add('hidden')});
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{mp.classList.add('hidden');go(b.dataset.v)});go('home')})();
function go(x,open){document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===x));render(x,open)}
async function load(){const [{data:c},{data:pr},pend]=await Promise.all([sb.from('campaigns').select('*').order('created_at',{ascending:false}),sb.rpc('my_campaign_progress'),sb.from('submissions').select('id,campaign_id',{count:'exact'}).eq('status','pending').limit(50)]);
 C=c||[];P=Object.fromEntries((pr||[]).map(p=>[p.campaign_id,p]));PEND=pend.data||[];PN=pend.count||0}
const tg=s=>s==='active'?'ok':s==='rejected'?'bad':'wait';
function card(c){const p=P[c.id]||{total:0,claimed:0,approved:0};const pc=p.total?Math.round(p.claimed/p.total*100):0;
 return `<div class="card" style="margin-top:12px"><div class="row"><span class="tag">${esc(c.task_type)}</span><span class="tag ${tg(c.status)}">${c.status.replace('_',' ')}</span></div>
 <h3 style="font-size:19px">${esc(c.title)}</h3><p style="margin-bottom:10px">${c.funded?'Funded':'Awaiting funding confirmation'}${c.reject_reason?' · Reason: '+esc(c.reject_reason):''}</p>
 <div class="bar2"><div style="width:${pc}%"></div></div><p style="margin:8px 0 14px;font-size:14px">${p.claimed} of ${p.total} tests taken · ${p.approved} approved</p>
 <button class="btn btn-out btn-sm" onclick="subs('${c.id}')">Review submissions</button><div id="s-${c.id}" style="margin-top:12px"></div></div>`}
async function render(x,open){v.innerHTML='<p class="note">Loading…</p>';await load();
 if(x==='home'){const first=esc(me.org_name||(me.full_name||'').split(' ')[0]);
  const stats=[['Active projects',C.filter(c=>c.status==='active').length],['Tests completed',Object.values(P).reduce((a,p)=>a+Number(p.approved),0)],['Waiting for review',PN],['Total funded',naira(C.filter(c=>c.funded).reduce((a,c)=>a+Number(c.budget),0))]];
  const by={};PEND.forEach(s=>by[s.campaign_id]=(by[s.campaign_id]||0)+1);
  v.innerHTML=`<div class="sec">Welcome, ${first}</div><p style="color:var(--muted);margin:0 0 16px">Get honest feedback from real Nigerian participants.</p>
  <button class="btn btn-blue block" onclick="go('create')">Create project</button>
  <div class="grid" style="margin-top:18px;grid-template-columns:1fr 1fr">${stats.map(([a,b])=>`<div class="card" style="padding:18px"><div style="color:var(--muted);font-size:14px">${a}</div><div class="stat" style="color:#fff;font-size:24px;margin-top:6px">${b}</div></div>`).join('')}</div>
  <h3 style="margin:22px 0 4px">Needs your attention</h3>${Object.keys(by).map(id=>{const c=C.find(x=>x.id===id);return c?`<div class="card row" style="margin-top:10px"><span>${esc(c.title)} · ${by[id]} waiting</span><button class="btn btn-blue btn-sm" onclick="go('projects','${id}')">Review</button></div>`:''}).join('')||'<p class="note" style="text-align:left">Nothing is waiting for you.</p>'}
  <h3 style="margin:22px 0 4px">Recent projects</h3>${C.slice(0,3).map(card).join('')||'<p class="note" style="text-align:left">No projects yet. Create your first project.</p>'}`}
 else if(x==='projects'){v.innerHTML='<div class="sec">Projects</div>'+(C.map(card).join('')||'<p class="note">No projects yet.</p>');if(open)subs(open)}
 else if(x==='create')form();
 else if(x==='billing'){const f=C.filter(c=>c.funded),tot=f.reduce((a,c)=>a+Number(c.budget),0),due=C.filter(c=>!c.funded&&c.status!=='rejected').reduce((a,c)=>a+Number(c.budget),0);
  v.innerHTML=`<div class="sec">Billing</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card" style="padding:18px"><div style="color:var(--muted);font-size:14px">Funded</div><div class="stat" style="font-size:24px">${naira(tot)}</div></div><div class="card" style="padding:18px"><div style="color:var(--muted);font-size:14px">Awaiting payment</div><div class="stat" style="color:#fcd34d;font-size:24px">${naira(due)}</div></div></div>
  <p class="note" style="text-align:left">Funding is confirmed by TaskBridj before a project goes live. Payment details will appear here when online payments are set up.</p>`+C.map(c=>`<div class="card row" style="margin-top:10px"><span>${esc(c.title)}</span><span><b>${naira(c.budget)}</b> <span class="tag ${c.funded?'ok':'wait'}">${c.funded?'funded':'unpaid'}</span></span></div>`).join('')}
 else{v.innerHTML=`<div class="sec">Profile</div><div class="card"><div class="box" style="margin-top:0"><small>Name</small><b>${esc(me.full_name)}</b></div><div class="box"><small>Business</small><b>${esc(me.org_name||'Not set')}</b></div><div class="box"><small>Industry</small><b>${esc(me.industry||'Not set')}</b></div><div class="box"><small>Contact email</small><b>${esc(me.contact_email||'Not set')}</b></div><button class="btn btn-out block" style="margin-top:16px" onclick="logout()">Log out</button></div>`}}
async function subs(id){const box=document.getElementById('s-'+id);if(!box)return;box.innerHTML='Loading…';
 const {data}=await sb.from('submissions').select('*').eq('campaign_id',id).order('created_at');
 if(!data?.length){box.innerHTML='<p style="color:var(--muted)">No submissions yet.</p>';return}
 let h='';for(const s of data){let link='';const {data:u}=await sb.storage.from('evidence').createSignedUrl(s.evidence_path,600);if(u)link=`<a href="${u.signedUrl}" target="_blank" rel="noopener" style="color:#60a5fa">View evidence</a>`;
  h+=`<div style="border-top:1px solid var(--line);padding:12px 0"><div class="row"><span class="tag ${s.status==='approved'?'ok':s.status==='rejected'?'bad':'wait'}">${s.status}</span>${link}</div>
  <div style="margin:8px 0;color:#c8cfdb;font-size:14px">${(s.answers||[]).map(a=>'• '+esc(a)).join('<br>')}</div>
  ${s.status==='pending'?`<button class="btn btn-green btn-sm" onclick="review('${s.id}',true,'${id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="review('${s.id}',false,'${id}')">Reject</button>`:s.reject_reason?'Reason: '+esc(s.reject_reason):''}</div>`}
 box.innerHTML=h}
async function review(sid,ok,cid){let reason=null;if(!ok){reason=prompt('Reason for rejecting (the participant will see this):');if(!reason||!reason.trim())return toast('A reason is required')}
 const {error}=await sb.rpc('review_submission',{p_id:sid,p_approve:ok,p_reason:reason});if(error)return toast(error.message);toast(ok?'Approved':'Rejected');subs(cid)}
async function form(){const {data:T}=await sb.rpc('task_types');
 v.innerHTML=`<div class="sec">Create project</div><div class="card"><label>Project title<input id="ptitle"></label>
 <label>Task type<select id="ptype">${(T||[]).map(t=>'<option>'+esc(t)+'</option>').join('')}</select></label>
 <label>How many participants do you need?<input id="cnt" type="number" min="10" value="50"></label>
 <label class="chk"><input type="checkbox" id="rec"><span>Screen recording required (extra cost per participant)</span></label>
 <div class="box"><p id="sum" style="margin:0 0 8px;color:#C8CFDB;font-size:14px"></p><p id="dsc" style="margin:0 0 8px;color:#6ee7b7;font-size:14px" hidden></p>
 <div class="row"><span style="color:var(--muted)">Estimated total cost</span><b id="ttl" class="stat" style="font-size:24px"></b></div><p style="margin:8px 0 0;font-size:13px;color:var(--muted)">Includes the TaskBridj service fee. You confirm this before anything is charged.</p></div>
 <div id="big" class="note" hidden style="text-align:left">For more than 10,000 participants we agree a price with you.<br><button id="qb" class="btn btn-out btn-sm" style="margin-top:10px">Request custom quote</button></div>
 <div id="fields"><label>What should participants do?<textarea id="ins" rows="4"></textarea></label><label>Who can take part? (optional)<textarea id="preq" rows="2"></textarea></label>
 <label>Questions (one per line)<textarea id="qs" rows="3"></textarea></label><label>Evidence required<input id="pev" placeholder="e.g. Screenshot of the confirmation page"></label>
 <div id="err" class="err" role="alert" hidden></div><button id="save" class="btn btn-blue block" style="margin-top:16px">Submit for review</button></div></div>`;
 let qt;const calc=()=>{const n=Math.max(+cnt.value||0,0);sum.textContent=ptype.value+' × '+n+' participants'+(rec.checked?' · with screen recording':'');
  const big=n>10000;big_.hidden=!big;fields.hidden=big;clearTimeout(qt);if(big){ttl.textContent='Custom quote';dsc.hidden=true;return}
  qt=setTimeout(async()=>{const {data}=await sb.rpc('quote_campaign',{p_type:ptype.value,p_count:n,p_rec:rec.checked});if(!data)return;ttl.textContent=naira(data.total);
   dsc.hidden=!(data.discount>0);dsc.textContent='Volume discount applied: '+Math.round(data.discount*100)+'% off'},250)};
 window.big_=document.getElementById('big');[ptype,cnt,rec].forEach(e=>e.oninput=calc);calc();
 qb.onclick=async()=>{const {error}=await sb.rpc('request_quote',{p_type:ptype.value,p_count:+cnt.value,p_note:ptitle.value});toast(error?error.message:'Quote request sent. We will contact you.')};
 save.onclick=async()=>{showErr(err,'');const questions=qs.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!ptitle.value.trim()||!ins.value.trim()||!questions.length||!pev.value.trim())return showErr(err,'Fill in the title, instructions, questions and evidence.');
  if(!(+cnt.value>=10))return showErr(err,'Choose at least 10 participants.');save.disabled=true;
  const {error}=await sb.rpc('create_campaign',{p_title:ptitle.value.trim(),p_type:ptype.value,p_ins:ins.value.trim(),p_req:preq.value.trim(),p_q:questions,p_ev:pev.value.trim(),p_count:+cnt.value,p_rec:rec.checked});
  save.disabled=false;if(error)return showErr(err,error.message);toast('Submitted. Your project goes live after funding is confirmed and it is reviewed.');go('projects')}}
</script></body></html>
